[package]
name = "trailhead"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trailbase-wasm = "=0.6.0"
url = "2"
wstd = "=0.5.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
